apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-project-app2
  labels:
    app: python-project-app2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-project-app2
  template:
    metadata:
      labels:
        app: python-project-app2
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "python-project"
        vault.hashicorp.com/agent-inject-secret-app.env: "secret/data/python-project/dev"
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{- with secret "secret/data/python-project/dev" -}}
          {{- range $k, $v := .Data.data -}}
          {{ $k }}={{ $v }}
          {{ end -}}
          {{- end -}}
        vault.hashicorp.com/agent-pre-populate-only: "true"
    spec:
      serviceAccountName: python-project-app2
      containers:
        - name: python-project-app2
          image: registry.localhost:5001/python-project-app2:local
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: python-project-app2-config
            - secretRef:
                name: python-project-app2-secrets
          env:
            - name: VAULT_SECRETS_FILE
              value: "/vault/secrets/app.env"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
